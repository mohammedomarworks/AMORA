name: Windows AMORA Orbit CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*-beta*'
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-orbit.yml'
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-orbit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Validate (x64 Release)
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
      sha256: ${{ steps.validate.outputs.sha256 }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate Version Metadata and Release Tag
        id: metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content Windows/AMORA.Orbit/AMORA.Orbit.csproj -Raw
          [xml]$testProject = Get-Content Windows/AMORA.Orbit.Tests/AMORA.Orbit.Tests.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $informationalVersion = $project.SelectSingleNode('/Project/PropertyGroup/InformationalVersion').InnerText.Trim()
          $testVersion = $testProject.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -ne $testVersion -or $version -ne $informationalVersion) {
            throw "Version metadata must agree: project '$version', informational '$informationalVersion', tests '$testVersion'."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+-beta(?:\.\d+)?$') {
            throw "Expected a beta version in AMORA.Orbit.csproj; found '$version'."
          }

          $archiveName = "AMORA.Orbit-v$version-win-x64.zip"
          $manifest = Get-Content Windows/RELEASE_MANIFEST.md -Raw
          $expectedPackageLine = '(?m)^\*\*Package:\*\*\s+`' + [regex]::Escape($archiveName) + '`$'
          $expectedVersionLine = '(?m)^\*\*Version:\*\*\s+`' + [regex]::Escape($version) + '`$'
          if ($manifest -notmatch $expectedPackageLine -or $manifest -notmatch $expectedVersionLine) {
            throw "Windows/RELEASE_MANIFEST.md must declare package '$archiveName' and version '$version'."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag '$($env:GITHUB_REF_NAME)' must match the project version tag 'v$version'."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive_name=$archiveName"

      - name: Restore Dependencies
        run: msbuild Windows/AMORA.sln /p:Configuration=Release /p:Platform=x64 /t:Restore

      - name: Build Solution (Release x64)
        run: msbuild Windows/AMORA.sln /p:Configuration=Release /p:Platform=x64 /t:Build /m:4

      - name: Run xUnit Tests (Release x64)
        run: dotnet test Windows/AMORA.Orbit.Tests/AMORA.Orbit.Tests.csproj --configuration Release --no-build --no-restore /p:Platform=x64 --verbosity normal --logger "console;verbosity=detailed"

      - name: Publish Release Package (win-x64)
        run: dotnet publish Windows/AMORA.Orbit/AMORA.Orbit.csproj --configuration Release --runtime win-x64 --self-contained true /p:Platform=x64 --output ./publish/win-x64

      - name: Stage Release Manifest
        shell: pwsh
        run: |
          Copy-Item Windows/RELEASE_MANIFEST.md -Destination ./publish/win-x64/RELEASE_MANIFEST.md -Force

      - name: Compress Release Archive
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
        run: |
          $archivePath = Join-Path '.' $env:ARCHIVE_NAME
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath $archivePath -Force

      - name: Validate Release Package
        id: validate
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
        run: |
          $archivePath = Join-Path '.' $env:ARCHIVE_NAME
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Beta package archive $env:ARCHIVE_NAME was not generated."
          }

          $zipSize = (Get-Item -LiteralPath $archivePath).Length
          Write-Host "Beta archive size: $zipSize bytes"
          if ($zipSize -lt 1000000) {
            throw "Package size ($zipSize bytes) is suspiciously small for a self-contained WinUI 3 distribution."
          }

          $validationDirectory = Join-Path $env:RUNNER_TEMP 'amora-orbit-zip-validation'
          Remove-Item -LiteralPath $validationDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archivePath -DestinationPath $validationDirectory -Force

          $requiredFiles = @('AMORA.Orbit.exe', 'AMORA.Orbit.dll', 'resources.pri', 'RELEASE_MANIFEST.md')
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $validationDirectory $file) -PathType Leaf)) {
              throw "Required file $file is missing from the validated archive."
            }
          }

          $manifestText = Get-Content (Join-Path $validationDirectory 'RELEASE_MANIFEST.md') -Raw
          if ($manifestText -notmatch [regex]::Escape($env:ARCHIVE_NAME)) {
            throw 'The staged release manifest does not match the archive version.'
          }

          $forbiddenFiles = Get-ChildItem -LiteralPath $validationDirectory -Recurse -File | Where-Object {
            $_.Extension -in @('.apikey', '.key', '.token', '.user') -or $_.Name -match 'secret'
          }
          if ($forbiddenFiles.Count -gt 0) {
            throw "Prohibited secret or development files found in release package: $($forbiddenFiles.FullName -join ', ')"
          }

          $sha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha256"
          Write-Host "Release package validation succeeded. SHA-256: $sha256"

      - name: Upload Temporary CI Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.archive_name }}
          path: ./${{ steps.metadata.outputs.archive_name }}
          retention-days: 30

  publish-prerelease:
    name: Publish GitHub Pre-release
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Validated Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-test.outputs.archive_name }}
          path: ./release-assets

      - name: Verify Downloaded Package Hash
        env:
          ASSET_PATH: ./release-assets/${{ needs.build-and-test.outputs.archive_name }}
          EXPECTED_SHA256: ${{ needs.build-and-test.outputs.sha256 }}
        run: |
          test -f "$ASSET_PATH"
          actual_sha256="$(sha256sum "$ASSET_PATH" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Downloaded package hash does not match the validated build output." >&2
            exit 1
          fi

      - name: Publish Versioned Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_PATH: ./release-assets/${{ needs.build-and-test.outputs.archive_name }}
          ASSET_NAME: ${{ needs.build-and-test.outputs.archive_name }}
          ASSET_SHA256: ${{ needs.build-and-test.outputs.sha256 }}
        run: |
          {
            printf '%s\n' 'AMORA Orbit controlled Windows beta.' ''
            printf '%s\n' "Version: $RELEASE_TAG" 'Architecture: Windows x64 (win-x64)' ''
            printf '%s\n' 'This executable is unsigned. Windows SmartScreen may show an Unknown Publisher warning.' ''
            printf 'Package: `%s`\n' "$ASSET_NAME"
            printf 'SHA-256: `%s`\n\n' "$ASSET_SHA256"
            printf '%s\n' '[Installation instructions](https://github.com/mohammedomarworks/AMORA/blob/main/Windows/README.md#controlled-public-beta-guide) · [Release manifest](https://github.com/mohammedomarworks/AMORA/blob/main/Windows/RELEASE_MANIFEST.md)'
          } > release-notes.md

          # gh release create fails when this tag already has a release; never clobber assets.
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AMORA Orbit $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
